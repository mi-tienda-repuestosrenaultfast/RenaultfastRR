  <div class="carrito">
    <h2>Carrito</h2>
    <ul id="listaCarrito"></ul>
    <p><strong>Total: $<span id="total">0.00</span></strong></p>
    <button onclick="enviarPedido()">Enviar por WhatsApp</button>
  </div>
  <script>
    const carrito = [];
    function agregarAlCarrito(nombre, precio) {
      carrito.push({nombre, precio});
      actualizarCarrito();
    }
    function actualizarCarrito() {
      const lista = document.getElementById("listaCarrito");
      lista.innerHTML = "";
      let total = 0;
      carrito.forEach(prod => {
        const li = document.createElement("li");
        li.innerText = `${prod.nombre} - $${prod.precio.toFixed(2)}`;
        lista.appendChild(li);
        total += prod.precio;
      });
      document.getElementById("total").innerText = total.toFixed(2);
    }
    function enviarPedido() {
      if (carrito.length === 0) {
        alert("Tu carrito está vacío");
        return;
      }
      let mensaje = "Hola, quiero comprar:%0A";
      let total = 0;
      carrito.forEach(p => {
        mensaje += `- ${p.nombre} - $${p.precio.toFixed(2)}%0A`;
        total += p.precio;
      });
      mensaje += `%0ATotal: $${total.toFixed(2)}`;
      window.open(`https://wa.me/593987292577?text=${mensaje}`, "_blank");
    }
  </script>
